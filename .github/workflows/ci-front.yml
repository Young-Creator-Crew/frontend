name: CI - Frontend

on:
  pull_request:
    branches:
      - preprod
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Gerar build
        run: npm run build
